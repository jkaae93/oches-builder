name: Feature request
description: Propose a product or technical improvement
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Who is affected, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing implementation unnecessarily.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes or scenarios.
    validations:
      required: false
