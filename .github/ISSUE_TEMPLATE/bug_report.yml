name: Bug report
description: Report a reproducible problem
title: "fix: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, app/tool version, and relevant configuration.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal data before sharing.
    validations:
      required: false
