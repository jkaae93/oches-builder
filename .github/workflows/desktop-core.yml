name: Desktop and Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Record toolchain
        run: |
          uname -sm
          flutter --version
          xcodebuild -version
          swift --version
      - name: Resolve, analyze, test and build desktop
        working-directory: apps/desktop
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build macos --debug
      - name: Test Core
        run: swift test --package-path core
